version: '3.8'

services:
  api:
    build:
      context: .
      target: api
    environment:
      - NODE_ENV=test
      - DATABASE_PATH=/app/storage/test.db
      - ENABLE_OIDC=false
      - ALLOW_REGISTRATION=true
      - SESSION_SECRET=test-session-secret
    volumes:
      - ./storage:/app/storage
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      target: frontend
    environment:
      - VITE_AZURE_OPENAI_ENDPOINT=https://test.openai.azure.com
      - VITE_AZURE_OPENAI_API_KEY=test-key
      - VITE_AZURE_OPENAI_API_VERSION=2024-02-01
      - VITE_AZURE_OPENAI_WHISPER_DEPLOYMENT=whisper-test
      - VITE_AZURE_OPENAI_GPT_DEPLOYMENT=gpt-4-test
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s