    <!--

    -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />

    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <title>kAInban - AI-Powered Task Management</title>

    <!--
      Theme bootstrap — runs synchronously before React mounts to avoid the
      flash of unstyled content (FOUC) on dark/light switch.
      Workhorse Dark is the home theme, so we default to dark unless the
      user has previously selected light (persisted in localStorage under
      'kainban-theme') OR the OS reports light preference AND no user
      override is set.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('kainban-theme');
          var theme;
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else {
            // No user preference: default to dark (the home for this audience).
            theme = 'dark';
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (_e) {
          // localStorage unavailable (e.g. private browsing) — default dark.
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Google reCAPTCHA v3 - loaded dynamically if enabled -->
  </body>
